; ============================================================================
;  Screwdriver - a pocket multi-tool for the M5Stack StickS3
; ============================================================================
[platformio]
default_envs = sticks3
src_dir = src

; ---------------------------------------------------------------------------
;  Shared settings for every on-target build
; ---------------------------------------------------------------------------
[sticks3_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-PICO-1-N8R8: 8MB QIO flash + 8MB Octal PSRAM
;
; Our own table rather than default_8MB.csv, which gives NVS twenty kilobytes -
; and NVS ran out, which took WiFi down with it. See the header of
; partitions_screwdriver.csv for what was in it and why the space comes from the
; OTA slot.
board_build.partitions = partitions_screwdriver.csv
; And boot_app0.bin has to follow otadata, which moved with it. The build pins
; that image to a hardcoded 0xE000 - now inside NVS - and does not consult
; board_upload.ota_partition_offset on an Arduino-only build, so the image list
; is corrected from the table itself. See tools/flash_offsets.py.
extra_scripts = post:tools/flash_offsets.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000

; PlatformIO finds the StickS3 on its own. Pin it with
; `pio run -t upload --upload-port /dev/...` if you have more than one board
; attached.

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_M5STACK_STICKS3
    -DBOARD_HAS_PSRAM
    ; USB-CDC on boot so Serial goes over the Type-C port
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc

; Warnings on our own sources only - the M5 libraries are not warning-clean and
; their noise would bury ours.
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    M5PM1=https://github.com/m5stack/M5PM1

; ---------------------------------------------------------------------------
;  Release: what you flash day to day
; ---------------------------------------------------------------------------
[env:sticks3]
extends = sticks3_base
build_type = release
build_flags =
    ${sticks3_base.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DSD_LOG_LEVEL=2          ; SD_* = Screwdriver log level (2 = warn)
    -Os

; ---------------------------------------------------------------------------
;  Debug: verbose logging, assertions, no optimisation surprises
; ---------------------------------------------------------------------------
[env:sticks3-debug]
extends = sticks3_base
build_type = debug
build_flags =
    ${sticks3_base.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DSD_LOG_LEVEL=5          ; verbose
    -DSD_DEBUG=1
    -Og -g3

; ---------------------------------------------------------------------------
;  Host-side unit tests for the hardware-free math (pio test -e native)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Isrc
    -DSD_HOST_BUILD=1
    -lm
; Compile the hardware-free maths into the test binary; everything else in
; src/ needs Arduino and is excluded.
test_build_src = yes
; Beyond mathx, the hardware-free logic that is worth checking on a laptop.
; Each of these is a statement rather than an act - which mask a request really
; means, which page answers a URL, what order the launcher lists apps in - and
; the half that touches a peripheral lives in a different file in every case.
;
; This list is also the guard. Anything added here that later reaches for an
; Arduino header stops compiling for the host, so a piece of logic cannot lose
; its testability quietly: it has to be taken off this line, on purpose.
build_src_filter = -<*> +<mathx/*.cpp>
    +<core/Caps.cpp>
    +<core/AppRegistry.cpp>
    +<web/PageRegistry.cpp>

; ---------------------------------------------------------------------------
;  The same tests, under the address and undefined-behaviour sanitizers.
;
;  Worth running before anything ships. It caught a left shift of a negative
;  value in the bitcrush - undefined behaviour on every sample below the axis,
;  which this toolchain happens to compile into exactly what was intended. No
;  test could have found that by looking at the output, because the output was
;  correct.
;
;    pio test -e native-san
; ---------------------------------------------------------------------------
[env:native-san]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -g -O1
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=undefined
